  <line x1="32" y1="122" x2="468" y2="122" stroke="#1E293B" stroke-width="1"/>

  <text x="48" y="144" fill="#CBD5E1" font-family="ui-monospace, PingFang SC, monospace" font-size="11.5">&gt; "帮我查一下昨天那个 Swarm 的最终结论"</text>
  <text x="48" y="166" fill="#94A3B8" font-family="ui-monospace, PingFang SC, monospace" font-size="11">第 1–3 轮   $ sqlite3 conversation_summaries.db ...</text>
  <text x="48" y="185" fill="#94A3B8" font-family="ui-monospace, PingFang SC, monospace" font-size="11">第 4–7 轮   $ grep -rn ... ~/.gemini/.../brain/*</text>
  <text x="48" y="204" fill="#F87171" font-family="ui-monospace, PingFang SC, monospace" font-size="11">第 8–10 轮  ! 输出过长被截断 → 溢盘写入 output.txt</text>
  <text x="48" y="223" fill="#94A3B8" font-family="ui-monospace, PingFang SC, monospace" font-size="11">第 11–13 轮 $ python3 -c "解析 board.jsonl..."</text>
