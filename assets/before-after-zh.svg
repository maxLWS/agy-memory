  <line x1="492" y1="122" x2="928" y2="122" stroke="#1E3A3A" stroke-width="1"/>

  <text x="508" y="144" fill="#E2E8F0" font-family="ui-monospace, PingFang SC, monospace" font-size="11.5">&gt; "帮我查一下昨天那个 Swarm 的最终结论"</text>
  <text x="508" y="166" fill="#38BDF8" font-family="ui-monospace, PingFang SC, monospace" font-size="11">Hook 44ms  [agy-memory] 开场快照已自动带出近期会话</text>
  <text x="508" y="185" fill="#6EE7B7" font-family="ui-monospace, PingFang SC, monospace" font-size="11">第 1 轮     search_sessions(sessionId, query) → 20ms</text>
  <text x="508" y="204" fill="#6EE7B7" font-family="ui-monospace, PingFang SC, monospace" font-size="11">第 2 轮     read_session(mode="swarm", startSeq/query)</text>
  <text x="508" y="223" fill="#A7F3D0" font-family="ui-monospace, PingFang SC, monospace" font-size="11">           倒推保新装入预算 · 严格 ≤8.6 KB 不溢盘</text>
  <text x="508" y="242" fill="#F8FAFC" font-family="ui-monospace, PingFang SC, monospace" font-size="11">第 3 轮     直接输出准确结论 · 0 次退回 shell</text>

  <rect x="508" y="260" width="404" height="44" rx="8" fill="#062820" stroke="#059669" stroke-width="1"/>
  <text x="524" y="279" fill="#6EE7B7" font-family="ui-monospace, PingFang SC, monospace" font-size="11.5" font-weight="600">长 Swarm 回溯 (T3)：3 轮 (-79%) · 24.3s (-73%)</text>
  <text x="524" y="296" fill="#34D399" font-family="ui-monospace, PingFang SC, monospace" font-size="11">43.4k 等效 Token (-63%) · 0 次原生 shell · 0 次溢盘</text>

  <!-- Bottom Aggregate Metrics Card -->
  <rect x="32" y="338" width="896" height="146" rx="12" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
  <text x="52" y="364" fill="#E2E8F0" font-family="ui-sans-serif, PingFang SC, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700">7 项全量任务汇总（T1–T7 · Baseline → v0.1.0 → v0.2.0）</text>

