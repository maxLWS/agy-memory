<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Outer card -->
  <rect width="960" height="510" rx="16" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="958.5" height="508.5" rx="15.25" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="40" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700">agy-memory — 真实 Antigravity (agy) A/B 对比实测</text>
  <text x="32" y="62" fill="#94A3B8" font-family="ui-sans-serif, -apple-system, PingFang SC, Microsoft YaHei, sans-serif" font-size="13">7 类跨对话检索任务 · 冻结 139 条本地历史语料 · 固定同一模型 · 按任务隔离 HOME 环境</text>
  <rect x="780" y="22" width="148" height="28" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
