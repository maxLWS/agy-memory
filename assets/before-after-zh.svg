  <text x="64" y="296" fill="#F87171" font-family="ui-monospace, PingFang SC, monospace" font-size="11">10 次原生 shell · 2 次磁盘溢出 · 全套件 57 次裸翻日志</text>

  <!-- Right panel: agy-memory v0.2.0 -->
  <rect x="492" y="84" width="436" height="236" rx="12" fill="#0F1F26" stroke="#10B981" stroke-width="1.2"/>
  <circle cx="512" cy="105" r="5" fill="#34D399"/>
  <circle cx="528" cy="105" r="5" fill="#38BDF8"/>
