<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" fill="none">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="1040" height="440" rx="12" fill="#FFFFFF"/>
  <rect x="0.75" y="0.75" width="1038.5" height="438.5" rx="11.25" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="28" y="34" fill="#0F172A" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">agy-memory Architecture</text>
  <text x="28" y="54" fill="#64748B" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">100% local · zero runtime dependencies · strictly read-only on agent history</text>

  <!-- Column 1: Local Data Sources -->
  <rect x="24" y="74" width="258" height="342" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="40" y="98" fill="#334155" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">LOCAL STORES (DISK)</text>

  <rect x="38" y="112" width="230" height="84" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="50" y="132" fill="#1D4ED8" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">Antigravity (read-only)</text>
  <text x="50" y="150" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">conversation_summaries.db</text>
  <text x="50" y="166" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">transcript.jsonl + _full.jsonl</text>
  <text x="50" y="182" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">artifacts/*.md · swarm/board.jsonl</text>

  <rect x="38" y="208" width="230" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="50" y="228" fill="#0F172A" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">Codex CLI (opt-in, read-only)</text>
  <text x="50" y="246" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">~/.codex/sessions/**/*.jsonl</text>
  <text x="50" y="259" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">session_index.jsonl · archived/</text>

  <rect x="38" y="276" width="230" height="52" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="50" y="296" fill="#0F172A" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">Claude Code (opt-in, read-only)</text>
  <text x="50" y="314" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">~/.claude/projects · transcripts/</text>

  <rect x="38" y="338" width="230" height="64" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="50" y="358" fill="#15803D" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">Editable Notes (read/write)</text>
  <text x="50" y="376" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">memory/topics/&lt;id&gt;.md (schema: 1)</text>
  <text x="50" y="392" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">memory/MEMORY.md (managed index)</text>

  <!-- Column 2: agy-memory Core (generous 386px width, 358px inner cards) -->
  <rect x="328" y="74" width="386" height="342" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.4"/>
  <text x="344" y="98" fill="#1E40AF" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">agy-memory ENGINE (dist/mcp-server.mjs)</text>

  <rect x="342" y="112" width="358" height="64" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="354" y="132" fill="#0F172A" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">Catalog &amp; Full-Text Search</text>
  <text x="354" y="149" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">node:sqlite / sqlite3 / JS fallback · cached by mtime</text>
  <text x="354" y="165" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">CJK+EN search · full-reply hydration · literal rg prefilter</text>

  <rect x="342" y="186" width="358" height="68" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="354" y="206" fill="#0F172A" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">Streaming Trace Extractor (src/trace.ts)</text>
  <text x="354" y="223" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">Incremental byte-offset stream (32 MB / 2.5 s cap)</text>
  <text x="354" y="239" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">Verified write/read outcomes · exact command+cwd reruns</text>

  <rect x="342" y="264" width="358" height="64" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="354" y="284" fill="#0F172A" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">Revision-Checked Notes (src/notes.ts)</text>
  <text x="354" y="301" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">Atomic write + lockfile · expectedRevision CAS</text>
  <text x="354" y="317" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">Keeps user text in MEMORY.md · safe notes.json migration</text>

  <rect x="342" y="338" width="358" height="64" rx="8" fill="#FEFCE8" stroke="#FDE047" stroke-width="1.2"/>
  <text x="354" y="358" fill="#854D0E" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">Inline Budget Packer (&lt;= 8,650 B UTF-8)</text>
  <text x="354" y="375" fill="#713F12" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">Surrogate-safe clipping · newest-first Swarm packing</text>
  <text x="354" y="391" fill="#713F12" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">Zero output.txt disk spills · charOffset pagination</text>

  <!-- Column 3: Agent Surface -->
  <rect x="760" y="74" width="256" height="342" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="776" y="98" fill="#334155" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">ANTIGRAVITY SURFACE</text>

  <rect x="774" y="112" width="228" height="78" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="786" y="132" fill="#0F172A" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">SessionStart Hook</text>
  <text x="786" y="149" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">Read-only snapshot (&lt;= 1.8 KB)</text>
  <text x="786" y="165" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">Current ID · 5 recent sessions</text>
  <text x="786" y="180" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">Pinned workspace notes</text>

  <rect x="774" y="202" width="228" height="128" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="786" y="222" fill="#1D4ED8" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">5 Eager MCP Tools</text>
  <text x="786" y="241" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">list_sessions</text>
  <text x="786" y="258" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">search_sessions</text>
  <text x="796" y="272" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">text | file_history | error_history</text>
  <text x="786" y="289" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">read_session</text>
  <text x="786" y="306" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">save_note / recall_notes</text>
  <text x="786" y="321" fill="#64748B" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10">7.7 KB total schemas + rules</text>

  <rect x="774" y="342" width="228" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="786" y="362" fill="#0F172A" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">Standalone --cli</text>
  <text x="786" y="379" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">For Swarm workers &amp; scripts</text>
  <text x="786" y="394" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">list | search | read | stats</text>

