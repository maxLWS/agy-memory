  <line x1="700" y1="264" x2="772" y2="264" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="700" y1="372" x2="772" y2="372" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
