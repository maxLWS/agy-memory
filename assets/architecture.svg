<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" fill="none">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803D"/>
    </marker>
  </defs>

  <rect width="1040" height="420" rx="12" fill="#FFFFFF"/>
  <rect x="0.75" y="0.75" width="1038.5" height="418.5" rx="11.25" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="28" y="34" fill="#0F172A" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">agy-memory v0.4 Architecture</text>
  <text x="28" y="54" fill="#64748B" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Local-only · zero runtime dependencies · Antigravity App / CLI / IDE</text>

  <!-- Column 1: Local Disk Stores -->
  <rect x="24" y="74" width="276" height="322" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="40" y="98" fill="#334155" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="11.5" font-weight="700">LOCAL DISK STORES</text>

  <rect x="38" y="112" width="248" height="114" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="50" y="133" fill="#15803D" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">Project Blackboard (read/write)</text>
  <text x="50" y="152" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">~/.gemini/agy-memory/boards/</text>
  <text x="50" y="168" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">  &lt;scope&gt;/entries/&lt;slug&gt;.md</text>
  <text x="50" y="188" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">Per-key linkSync lock + dead-PID reap</text>
  <text x="50" y="205" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">expectedRevision CAS on update/delete</text>

  <rect x="38" y="240" width="248" height="142" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="50" y="261" fill="#1D4ED8" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">Antigravity History (read-only)</text>
  <text x="50" y="280" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">~/.gemini/antigravity{,-cli,-ide}</text>
  <text x="50" y="298" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">conversation_summaries.db (WAL)</text>
  <text x="50" y="315" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">conversations/&lt;id&gt;.db (field 18)</text>
  <text x="50" y="332" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">transcript.jsonl + _full.jsonl</text>
  <text x="50" y="349" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">artifacts/*.md · swarm/board.jsonl</text>
  <text x="50" y="368" fill="#64748B" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10">Merged across all 3 clients by UUID</text>

  <!-- Column 2: Engine -->
  <rect x="344" y="74" width="352" height="322" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.4"/>
  <text x="360" y="98" fill="#1E40AF" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="11.5" font-weight="700">CORE ENGINE (dist/*.mjs)</text>

  <rect x="358" y="112" width="324" height="72" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="370" y="132" fill="#0F172A" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">ScopeKey Resolver (src/scope.ts)</text>
  <text x="370" y="150" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">project/&lt;id&gt; · cli_repo/&lt;gitCommonDir&gt;</text>
  <text x="370" y="167" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">cli_workspace/&lt;path&gt; · global · unresolved</text>

  <rect x="358" y="196" width="324" height="84" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="370" y="216" fill="#0F172A" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">Turn-0 SessionStart Hook (dist/session-start.mjs)</text>
  <text x="370" y="234" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">&lt;= 1,536 B: inline whole board entries</text>
  <text x="370" y="251" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">&gt; 1,536 B: whole-key index (no mid-entry clipping)</text>
  <text x="370" y="268" fill="#64748B" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10">Read-only · p50 58.5 ms · +1-line sibling hint</text>

  <rect x="358" y="292" width="324" height="90" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="370" y="312" fill="#0F172A" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">Archive &amp; Trace Engine (store / search / trace)</text>
  <text x="370" y="330" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">Strict project scoping (or explicit allScopes=true)</text>
  <text x="370" y="347" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">file_history writes vs. reads · error_history reruns</text>
  <text x="370" y="364" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">32 MB streaming budget · &lt;= 8,650 B inline cap</text>

  <!-- Column 3: Agent Interface -->
  <rect x="740" y="74" width="276" height="322" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="756" y="98" fill="#334155" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="11.5" font-weight="700">AGENT INTERFACE (4 TOOLS + CLI)</text>

  <rect x="754" y="112" width="248" height="62" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="766" y="133" fill="#15803D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">board_read / board_post</text>
  <text x="766" y="151" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">Read, update, or delete active</text>
  <text x="766" y="165" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">project decisions and handoffs</text>

  <rect x="754" y="186" width="248" height="62" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="766" y="207" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">search_sessions</text>
  <text x="766" y="225" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">Omit query to list · text / file_history</text>
  <text x="766" y="239" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">/ error_history scoped to project</text>

  <rect x="754" y="260" width="248" height="58" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="766" y="281" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">read_session</text>
  <text x="766" y="299" fill="#475569" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">digest · turns · artifacts · unclipped swarm</text>

  <rect x="754" y="330" width="248" height="52" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="766" y="350" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">dist/mcp-server.mjs --cli</text>
  <text x="766" y="368" fill="#64748B" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="10.5">Direct CLI for Swarm workers &amp; scripts</text>

  <!-- Arrows -->
  <line x1="286" y1="168" x2="356" y2="148" stroke="#15803D" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <line x1="286" y1="176" x2="356" y2="236" stroke="#15803D" stroke-width="1.4" marker-end="url(#arrowGreen)"/>
  <line x1="286" y1="312" x2="356" y2="158" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arrowBlue)"/>
  <line x1="286" y1="336" x2="356" y2="336" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <line x1="682" y1="148" x2="752" y2="142" stroke="#15803D" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <line x1="682" y1="236" x2="752" y2="152" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="682" y1="322" x2="752" y2="218" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <line x1="682" y1="346" x2="752" y2="290" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
</svg>
