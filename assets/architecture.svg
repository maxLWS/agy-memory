  <line x1="268" y1="154" x2="340" y2="154" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="268" y1="237" x2="340" y2="215" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="268" y1="302" x2="340" y2="225" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="268" y1="370" x2="340" y2="300" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Connectors Col 2 -> Col 3 -->
