<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" fill="none">
  <rect width="1040" height="360" rx="12" fill="#FFFFFF"/>
  <rect x="0.75" y="0.75" width="1038.5" height="358.5" rx="11.25" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="28" y="34" fill="#0F172A" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">What changes when you open Chat B in the same Antigravity Project</text>
  <text x="28" y="54" fill="#64748B" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Measured on isolated headless agy runs (gemini-3.8-flash-medium &amp; claude-sonnet-5-5-medium)</text>

  <!-- Left: Without agy-memory -->
  <rect x="24" y="74" width="484" height="262" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
  <text x="42" y="100" fill="#991B1B" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="13" font-weight="700">Without agy-memory (or v0.3.0 across two Projects on one folder)</text>

  <rect x="40" y="114" width="452" height="156" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1"/>
  <text x="54" y="136" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Chat B opens in project/api-v2 (same folder as project/legacy):</text>
  <text x="54" y="158" fill="#B91C1C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">• Bare agy: starts blank -&gt; greps ~/.gemini/antigravity-cli/</text>
  <text x="64" y="176" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">  9-36 turns · 64-211s · 11-22 output.txt spills · 0/15 pass</text>
  <text x="54" y="202" fill="#B45309" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">• v0.3.0: matches folder path only (ignores project_id)</text>
  <text x="64" y="220" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">  Leaks project/legacy notes into project/api-v2 (0/5 pass)</text>
  <text x="54" y="246" fill="#B45309" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">• v0.3.0 / v0.4.0 Swarm read: clips messages at 1,400 chars</text>
  <text x="64" y="262" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">  Falls back to 11-23 shell commands -&gt; 126s timeout</text>

  <rect x="40" y="282" width="452" height="40" rx="6" fill="#FEE2E2"/>
  <text x="54" y="307" fill="#991B1B" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">Result: 0/15 bare pass · 0/5 dual-project isolation in v0.3.0</text>

  <!-- Right: With agy-memory v0.4.1 -->
  <rect x="532" y="74" width="484" height="262" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.4"/>
  <text x="550" y="100" fill="#166534" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="13" font-weight="700">With agy-memory v0.4.1 (Project Blackboard + Scoped Archive)</text>

  <rect x="548" y="114" width="452" height="156" rx="8" fill="#0F172A"/>
  <text x="562" y="136" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">[SessionStart · 58.5 ms · scope=project/api-v2 (field 18)]</text>
  <text x="562" y="156" fill="#86EFAC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Project board (1 entry, 184 B):</text>
  <text x="562" y="174" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">- retry-policy [rev=e6aa61696c47, src=cli:a629d4f8]:</text>
  <text x="562" y="191" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">  retry_backoff_ms=450, header=X-Epoch-812, max_batch=32</text>
  <text x="562" y="216" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Turn 1 -&gt; Chat B answers immediately (0 tool calls, 8.6-11.7s)</text>
  <text x="562" y="238" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">• project/legacy stays in its own board directory (0 bleed)</text>
  <text x="562" y="256" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">• Full Swarm verdict read in 50.4s / 5 turns / 0 spills</text>

  <rect x="548" y="282" width="452" height="40" rx="6" fill="#DCFCE7"/>
  <text x="562" y="307" fill="#166534" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700">Result: 15/15 Gemini · 10/10 Claude · 5/5 dual-project zero bleed</text>
</svg>
