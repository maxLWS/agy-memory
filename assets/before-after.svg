<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Outer card -->
  <rect width="960" height="510" rx="16" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="958.5" height="508.5" rx="15.25" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="40" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">agy-memory — Real Antigravity (agy) A/B Comparison</text>
  <text x="32" y="62" fill="#94A3B8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">7 cross-conversation recall tasks · frozen 139-session corpus · pinned model · isolated HOME per run</text>
  <rect x="780" y="22" width="148" height="28" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="854" y="40" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">v0.2.0 · 7/7 PASS</text>

  <!-- Left panel: Baseline -->
  <rect x="32" y="84" width="436" height="236" rx="12" fill="#131B2E" stroke="#334155" stroke-width="1"/>
  <circle cx="52" cy="105" r="5" fill="#F87171"/>
  <circle cx="68" cy="105" r="5" fill="#FBBF24"/>
  <circle cx="84" cy="105" r="5" fill="#475569"/>
  <text x="102" y="109" fill="#FCA5A5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700">BEFORE · Baseline (no agy-memory)</text>
  <line x1="32" y1="122" x2="468" y2="122" stroke="#1E293B" stroke-width="1"/>

  <text x="48" y="144" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">&gt; "Recall the Swarm conclusions from yesterday"</text>
  <text x="48" y="166" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Turn 1–3   $ sqlite3 conversation_summaries.db ...</text>
  <text x="48" y="185" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Turn 4–7   $ grep -rn ... ~/.gemini/.../brain/*</text>
  <text x="48" y="204" fill="#F87171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Turn 8–10  ! output truncated → spilled to output.txt</text>
  <text x="48" y="223" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Turn 11–13 $ python3 -c "parse board.jsonl..."</text>
  <text x="48" y="242" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Turn 14    Finally answers after 10 raw shell calls</text>

  <rect x="48" y="260" width="404" height="44" rx="8" fill="#1F1622" stroke="#7F1D1D" stroke-width="1"/>
  <text x="64" y="279" fill="#FCA5A5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600">Swarm Recall (T3): 14 turns · 91.1s · 116.1k eq tok</text>
  <text x="64" y="296" fill="#F87171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">10 raw shell scripts · 2 disk spills · 57 raw calls total</text>

  <!-- Right panel: agy-memory v0.2.0 -->
  <rect x="492" y="84" width="436" height="236" rx="12" fill="#0F1F26" stroke="#10B981" stroke-width="1.2"/>
  <circle cx="512" cy="105" r="5" fill="#34D399"/>
  <circle cx="528" cy="105" r="5" fill="#38BDF8"/>
  <circle cx="544" cy="105" r="5" fill="#475569"/>
  <text x="562" y="109" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700">AFTER · agy-memory v0.2.0</text>
  <line x1="492" y1="122" x2="928" y2="122" stroke="#1E3A3A" stroke-width="1"/>

  <text x="508" y="144" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">&gt; "Recall the Swarm conclusions from yesterday"</text>
  <text x="508" y="166" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Hook 44ms  [agy-memory] Recent sessions already injected</text>
  <text x="508" y="185" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Turn 1     search_sessions(sessionId, query) → 20ms</text>
  <text x="508" y="204" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Turn 2     read_session(mode="swarm", startSeq/query)</text>
  <text x="508" y="223" fill="#A7F3D0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">           newest-preserving budget · ≤8.6 KB inline</text>
  <text x="508" y="242" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Turn 3     Exact verified answer — 0 raw fallbacks</text>

  <rect x="508" y="260" width="404" height="44" rx="8" fill="#062820" stroke="#059669" stroke-width="1"/>
  <text x="524" y="279" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600">Swarm Recall (T3): 3 turns (-79%) · 24.3s (-73%)</text>
  <text x="524" y="296" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">43.4k eq tok (-63%) · 0 raw shell calls · 0 disk spills</text>

  <!-- Bottom Aggregate Metrics Card -->
  <rect x="32" y="338" width="896" height="146" rx="12" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
  <text x="52" y="364" fill="#E2E8F0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13.5" font-weight="700">7-Task Suite Aggregate (T1–T7 · Baseline → v0.1.0 → v0.2.0)</text>

  <!-- Metric 1: Model Time -->
  <text x="52" y="394" fill="#94A3B8" font-family="ui-sans-serif, sans-serif" font-size="12">Model Time</text>
  <text x="234" y="394" text-anchor="end" fill="#34D399" font-family="ui-monospace, monospace" font-size="12" font-weight="700">-64.1%</text>
  <rect x="52" y="402" width="182" height="10" rx="5" fill="#334155"/>
  <rect x="52" y="418" width="65" height="10" rx="5" fill="url(#greenBar)"/>
  <text x="52" y="444" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10.5">594.4s → 213.2s</text>
  <text x="52" y="460" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">Wall: 656.9s → 270.4s</text>

  <!-- Metric 2: LLM Turns -->
  <text x="272" y="394" fill="#94A3B8" font-family="ui-sans-serif, sans-serif" font-size="12">LLM Turns</text>
  <text x="454" y="394" text-anchor="end" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="12" font-weight="700">-57.7%</text>
  <rect x="272" y="402" width="182" height="10" rx="5" fill="#334155"/>
  <rect x="272" y="418" width="77" height="10" rx="5" fill="url(#blueBar)"/>
  <text x="272" y="444" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10.5">71 → 30 turns</text>
  <text x="272" y="460" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">v0.1.0 was 42 turns</text>

  <!-- Metric 3: Billable Tokens -->
  <text x="492" y="394" fill="#94A3B8" font-family="ui-sans-serif, sans-serif" font-size="12">Est. Billable Tokens</text>
  <text x="674" y="394" text-anchor="end" fill="#34D399" font-family="ui-monospace, monospace" font-size="12" font-weight="700">-46.5%</text>
  <rect x="492" y="402" width="182" height="10" rx="5" fill="#334155"/>
  <rect x="492" y="418" width="97" height="10" rx="5" fill="url(#greenBar)"/>
  <text x="492" y="444" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10.5">699.0k → 373.7k</text>
  <text x="492" y="460" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">Payload: 123.5 → 58.8 KB</text>

  <!-- Metric 4: Disk Spills & Raw Fallbacks -->
  <text x="712" y="394" fill="#94A3B8" font-family="ui-sans-serif, sans-serif" font-size="12">Disk Spills &amp; Raw Shell</text>
  <text x="908" y="394" text-anchor="end" fill="#34D399" font-family="ui-monospace, monospace" font-size="12" font-weight="700">-100%</text>
  <rect x="712" y="402" width="196" height="10" rx="5" fill="#7F1D1D"/>
  <rect x="712" y="418" width="8" height="10" rx="5" fill="#34D399"/>
  <text x="712" y="444" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10.5">Spills: 10 → 0</text>
  <text x="712" y="460" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">Raw transcript grep: 57 → 0</text>
</svg>
